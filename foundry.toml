[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned so that the bytecode committed in gethwrappers/ is reproducible. Foundry's
# defaults for these have changed over time (the optimizer now defaults to off).
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
